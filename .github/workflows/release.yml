# Obsidian installs a plugin from the three files attached to a release, and
# looks the version up by the tag — so the tag is the version, with no "v" in
# front of it, and the manifest has to agree with it before anything is built.
#
# Two ways in. Push a tag and this builds it. Or run it from the Actions tab
# with a version, and it mints the tag itself from the branch it was started
# on, which is the path for anywhere a tag cannot be pushed by hand.
#
# Either way what comes out is a draft. Publishing is a decision, not a side
# effect of asking for a build.

name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, e.g. 1.0.0. Must match manifest.json."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so an existing one can be spotted before it is written over,
          # and history, so the generated notes have something to work from.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the version, and check the manifest agrees
        id: version
        env:
          # Through the environment rather than interpolated into the script:
          # this input is a string somebody types.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$version' is not a version. Use 1.0.0, with no v." ; exit 1 ;;
          esac

          manifest=$(node -p "require('./manifest.json').version")
          echo "version $version / manifest.json $manifest"
          [ "$version" = "$manifest" ] || {
            echo "::error file=manifest.json::manifest.json says $manifest, not $version"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to reuse a tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::error::tag ${{ steps.version.outputs.version }} already exists"
            exit 1
          fi

      - run: npm ci

      - name: Typecheck, test and bundle
        run: npm run build

      - name: The committed main.js is the one this source builds
        run: |
          if ! git diff --quiet -- main.js; then
            echo "::error file=main.js::main.js is out of date at this version."
            exit 1
          fi

      - name: Mint the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Habbiter $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --draft \
            --generate-notes \
            main.js manifest.json styles.css
