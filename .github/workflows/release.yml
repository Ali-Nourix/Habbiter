# Obsidian installs a plugin from the three files attached to a release, and
# looks the version up by the tag — so the tag is the version, with no "v" in
# front of it, and the manifest has to agree with it before anything is built.
#
# Two ways in. Push a tag and this builds it. Or run it from the Actions tab
# with a version, and it mints the tag itself from the branch it was started
# on, which is the path for anywhere a tag cannot be pushed by hand.
#
# What comes out is a published release. A draft keeps its files to itself —
# they are not on the tag and nobody can download them — which defeats the
# point of building them.
#
# Re-running a version whose release is still unpublished finishes it rather
# than failing: that is the case where the files exist but nobody can reach
# them. A version that is already published is left alone.

name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, e.g. 1.0.0. Must match manifest.json."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so an existing one can be spotted before it is written over,
          # and history, so the generated notes have something to work from.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the version, and check the manifest agrees
        id: version
        env:
          # Through the environment rather than interpolated into the script:
          # this input is a string somebody types.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$version' is not a version. Use 1.0.0, with no v." ; exit 1 ;;
          esac

          manifest=$(node -p "require('./manifest.json').version")
          echo "version $version / manifest.json $manifest"
          [ "$version" = "$manifest" ] || {
            echo "::error file=manifest.json::manifest.json says $manifest, not $version"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Typecheck, test and bundle
        run: npm run build

      - name: The committed main.js is the one this source builds
        run: |
          if ! git diff --quiet -- main.js; then
            echo "::error file=main.js::main.js is out of date at this version."
            exit 1
          fi

      - name: Mint the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists, leaving it where it points"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Habbiter $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          WANTED: main.js,manifest.json,styles.css
        run: |
          set -euo pipefail

          # An unpublished release for this version is wreckage from a run
          # that stopped short. It holds the same tag as the real one and
          # shadows it in every lookup, so it goes first.
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$VERSION\") | .id" \
          | while read -r id; do
              echo "deleting unpublished release $id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done

          if gh release view "$VERSION" >/dev/null 2>&1; then
            have=$(gh release view "$VERSION" --json assets -q '[.assets[].name] | sort | join(",")')
            out=$(gh release view "$VERSION" --json isDraft -q '.isDraft | not')
            # Out already, and carrying its files: that is a shipped release
            # and not something to overwrite. Anything else — no files, or
            # never published — is a release that did not finish, and
            # finishing it is the job.
            if [ "$out" = "true" ] && [ "$have" = "$WANTED" ]; then
              echo "::error::$VERSION is already out with its files. Bump the version."
              exit 1
            fi
            echo "completing the existing release for $VERSION (published=$out, files=[$have])"
            gh release upload "$VERSION" main.js manifest.json styles.css --clobber
            gh release edit "$VERSION" --draft=false --latest
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --latest \
              --generate-notes \
              main.js manifest.json styles.css
          fi

      - name: The files are on the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$VERSION" --json isDraft,url,assets \
            -q '"published: " + (.isDraft | not | tostring), "url: " + .url,
                (.assets[] | "  " + .name + "  " + (.size | tostring) + " bytes")'

          # A green run that shipped nothing is the failure this whole file
          # exists to avoid, so it is asserted rather than eyeballed.
          [ "$(gh release view "$VERSION" --json isDraft -q '.isDraft | not')" = "true" ]
          [ "$(gh release view "$VERSION" --json assets -q '[.assets[].name] | sort | join(",")')" = "main.js,manifest.json,styles.css" ]
